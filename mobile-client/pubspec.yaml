name: mapetite
description: "Mapetite — Zero-Input micro-economy platform connecting merchants with users."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI & Theming
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0
  flutter_slidable: ^3.1.0

  # Navigation
  go_router: ^14.0.0

  # State
  flutter_riverpod: ^2.5.1

  # Images
  image_picker: ^1.1.2
  image_cropper: ^7.1.0

  # Networking
  dio: ^5.7.0

  # Storage
  shared_preferences: ^2.3.3

  # Utilities
  intl: ^0.20.2
  logger: ^2.4.0
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

  # Location
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/
    - assets/icons/
    - assets/icons/dietary/
    - assets/animations/
    - assets/fonts/

  # Inter fonts are served at runtime via the google_fonts package.
  # To bundle them locally instead, download the TTF files from
  # https://fonts.google.com/specimen/Inter and place them in assets/fonts/,
  # then uncomment the block below.
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
